<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joergs Leadgenerierung</title>
<style>
body { font-family: Arial; background: #f5f5f5; margin: 0; }
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }
header { background: #1a1a1a; color: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
h1 { margin: 0; font-size: 28px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 20px 0; }
.stat { background: #fff; padding: 20px; border-radius: 8px; border-left: 4px solid #4CAF50; text-align: center; }
.number { font-size: 32px; font-weight: bold; color: #4CAF50; }
.label { font-size: 12px; color: #666; margin-top: 10px; }
button { background: #4CAF50; color: #fff; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px; margin: 20px 0; }
button:disabled { opacity: 0.6; }
button:hover:not(:disabled) { background: #45a049; }
table { width: 100%; border-collapse: collapse; background: #fff; margin-top: 20px; }
th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
th { background: #f0f0f0; font-weight: bold; }
.message { padding: 12px; margin-bottom: 15px; border-radius: 5px; background: #d4edda; color: #155724; display: none; }
.message.show { display: block; }
</style>
</head>
<body>
<div class="container">
<header><h1>🚀 Joergs Leadgenerierung</h1></header>

<div class="message" id="msg"></div>

<div class="stats">
<div class="stat"><div class="number" id="total">0</div><div class="label">Gesamt Leads</div></div>
<div class="stat"><div class="number" id="new">0</div><div class="label">Neue Leads</div></div>
<div class="stat"><div class="number" id="contacted">0</div><div class="label">Kontaktiert</div></div>
</div>

<button id="btn" onclick="runFinder()">🔍 Finder starten</button>

<h2>Leads</h2>
<div id="table-container"></div>
</div>

<script>
async function load() {
  try {
    const r1 = await fetch('/api/stats');
    const s = await r1.json();
    document.getElementById('total').textContent = s.total_leads;
    document.getElementById('new').textContent = s.new_leads;
    
    const r2 = await fetch('/api/leads');
    const leads = await r2.json();
    
    let html = '';
    if (leads.length === 0) {
      html = '<p>Keine Leads - Finder starten!</p>';
    } else {
      html = '<table><tr><th>Unternehmen</th><th>Email</th><th>Branche</th><th>PLZ</th></tr>';
      for (let l of leads) {
        html += '<tr><td>' + l.company_name + '</td><td>' + l.email + '</td><td>' + l.industry + '</td><td>' + l.plz + '</td></tr>';
      }
      html += '</table>';
    }
    document.getElementById('table-container').innerHTML = html;
  } catch(e) { console.error(e); }
}

async function runFinder() {
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  btn.disabled = true;
  btn.textContent = 'Läuft...';
  msg.classList.remove('show');
  
  try {
    const r = await fetch('/api/finder/run', { method: 'POST' });
    const d = await r.json();
    msg.textContent = d.success ? ('✓ ' + d.inserted + ' Leads gefunden') : 'Error';
    msg.classList.add('show');
    setTimeout(() => { load(); btn.disabled = false; btn.textContent = '🔍 Finder starten'; }, 2000);
  } catch(e) {
    msg.textContent = '✗ Error';
    msg.classList.add('show');
    btn.disabled = false;
    btn.textContent = '🔍 Finder starten';
  }
}

load();
</script>
</body>
</html>
